command: ["uv", "run", "start-app"]
# databricks apps listen by default on port 8000

env:
  - name: MLFLOW_TRACKING_URI
    value: "databricks"
  - name: MLFLOW_REGISTRY_URI
    value: "databricks-uc"
  - name: API_PROXY
    value: "http://localhost:8000/invocations"
  - name: CHAT_APP_PORT
    value: "3000"
  - name: CHAT_PROXY_TIMEOUT_SECONDS
    value: "300"
  - name: MLFLOW_EXPERIMENT_ID
    value: "47805482660952"
  - name: NEXUS_BASE_URL
    value: "https://genai-nexus.int.api.corpinter.net"
  - name: NEXUS_API_KEY
    value_from:
      secret:
        scope: "llm-test"
        key: "nexus-api-key"
